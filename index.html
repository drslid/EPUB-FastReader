<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101619" />
    <meta
      name="description"
      content="Votre bibliothèque, votre rythme. Importez un EPUB, découvrez des classiques et lisez sur ordinateur, tablette ou téléphone."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      href="./icons/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>FastReader — Votre bibliothèque, votre rythme</title>
  </head>
  <body data-theme="night">
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div id="app"></div>
    <div id="reader-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      >Activez JavaScript pour ouvrir vos EPUB dans FastReader. Vos fichiers
      sont lus sur votre appareil.</noscript
    >
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
